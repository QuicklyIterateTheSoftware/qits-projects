# Projects config defaults, shipped from this library jar.
#
# Library jars ship defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's
# application.properties is ignored — read by whichever app pulls the jar in. The consuming app's
# own application.properties (ordinal 250) and the environment override any of these.

# --- persistence ------------------------------------------------------------------------------
# This context owns its OWN named datasource + persistence unit + Flyway lineage: a separate
# file-based H2 under ~/.qits/data/projects, never sharing qits' default DB or its migration
# history (the artifacts/ci/epics precedent). All four tables it touches — Project, Repository,
# repository_name, repository_submodule — live in THIS database, which is why they keep real
# foreign keys between them. Rows in other contexts (workspaces, commands, agents) are referenced
# by String id through a control/ port instead. Tests override the url to in-memory H2.
#
# The URL carries NO AUTO_SERVER. It did, inherited from the monorepo, and it is what stopped
# `service/` ever booting as a native binary: AUTO_SERVER makes the first opener start H2's own TCP
# server, and org.h2.server.TcpServer is loaded by name, so it is not in the image and the binary
# died during connection-pool warm-up with `ClassNotFoundException: org.h2.server.TcpServer` —
# before the HTTP port was even bound. Nothing in the suite could see it: the tests point both
# datasources at in-memory H2, which never reads the flag.
#
# Registering the H2 server classes for reflection was the alternative, and it works — but it is
# the wrong trade. AUTO_SERVER exists so a SECOND process can open the same file database, which a
# packaged single-process service does not do, and the price is a database server listening inside
# the service process. Epics' url in the sibling jar drops it for the same reason; this repo is the
# one with two datasources, so the flag had to go from both or the binary would still not boot.
quarkus.datasource.projects.db-kind=h2
quarkus.datasource.projects.jdbc.url=jdbc:h2:file:${user.home}/.qits/data/projects/h2/projects

# A dedicated persistence unit bound to that datasource, owning only this module's entities.
quarkus.hibernate-orm.projects.datasource=projects
quarkus.hibernate-orm.projects.packages=eu.wohlben.qits.projects.entity

# Own Flyway lineage at a distinct classpath location so it never mixes with the monorepo's
# db/migration. V1__init.sql is the V1..V45 shared lineage squashed to the four tables this context
# owns (migration-plan.md §7) — the schema as of V45, not a replay.
quarkus.flyway.projects.migrate-at-start=true
quarkus.flyway.projects.baseline-on-migrate=true
quarkus.flyway.projects.locations=classpath:db/projects/migration

# --- where the bare origins live ----------------------------------------------------------------
# The per-repo bare origin this context clones into and the metadata sidecars it writes beside it.
# Shared on-disk contract with the workspaces context, which branches its containers' checkouts
# from the same tree and therefore reads the same key.
qits.repositories.data-dir=${user.home}/.qits/data/repositories

# Where `git credential-store` keeps the credentials a remote-login session captures.
qits.repositories.credentials-file=${user.home}/.qits/data/git-credentials

# The identity qits commits as when it writes on a repository's behalf.
qits.git.author-name=qits
qits.git.author-email=qits@local

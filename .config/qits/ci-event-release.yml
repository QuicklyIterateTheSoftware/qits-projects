# The release pipeline: this repository reacts to its OWN release and pushes the image under the
# released VERSION.
#
# THE SELECTION NAMES THIS REPOSITORY, WHICH READS LIKE A LOOP AND IS NOT. `SCMRelease` says only
# "source control has this version" — this service's own Auto Release publishes it the instant it
# has stamped the CalVer and pushed the tag, and nothing in this file publishes it. So a repository listening for its own SCMRelease
# is exactly the release pipeline the split-release design asks each repository to own: the SCM half
# fires, this half builds the tagged commit and pushes it, and qits-ci turns the green run into one
# `SoftwareRelease` per entry under `artifacts:` below. The event that could loop is
# SoftwareRelease, and this file neither listens for it nor publishes it.
#
# THE VERSION TAG IS THE ONLY COORDINATE NOW, AND IT USED TO BE THE SECOND OF TWO. This file read
# `:$QITS_CI_SHA` at the push below for as long as there was a per-push image beside it — the sha
# coordinate was the contract with qits-deployments, and this pipeline pushed the released tree
# under it a second time so the two would never disagree. Both halves of that are gone: per-push CI
# is retired (ci-event-build.yml and ci-event-userflows.yml are one QA pipeline that publishes no
# image at all), and cd deploys a RELEASE rather than a green push. So the push below tags
# `$version` — the CalVer name the release was made under, which is what `artifacts:` declares, what
# the SBOM is filed under a few lines later, and what every consumer of the resulting
# `SoftwareRelease` asks for.
#
# `artifacts:` IS A DECLARATION, NOT A REPORT. qits-ci never learns how to publish anything, so it
# cannot see what the step below pushed; it announces `{repository, version, packageType,
# packageName}` on the strength of these two lines. Keep them true.
#
# THE NAME IS UNQUALIFIED ON PURPOSE. No registry-qualified docker reference is portable here — the
# registry is `qits-platform-artifacts:8080` inside a step container and `localhost:8081` to qits-ci
# and qits-deployments — and an OCI reference cannot carry a path prefix. So the declaration carries
# `qits/<application>` and the reader supplies its own host, exactly as the push below composes one
# from environment.
#
# THE BUILD BELOW IS ci-event-release-request.yml's, AND THE TWO MUST STAY MATCHED. The QA pipeline
# builds the same image content at the release-request fold and publishes nothing; this one builds
# it at the release tag and pushes it, so a fix to one build belongs in the other. That file is
# where the two halves, the submodule fetch, the lockfile origin swap and the `npm_config_*`
# environment are explained at length; this one carries the short form and points there rather than
# keeping a second copy of the reasoning to drift.
#
# THE CLIENT IS PACKAGED, NOT INSTALLED BY THE IMAGE BUILD. service/src/main/webui is the
# qits-projects-frontend submodule and it is built HERE, in this step container, which sits on qits-net
# and can reach the platform's npm registry. The Dockerfile's builder stage only packages the bundle
# this half produced. (The image build takes a network of its own now, for the Maven half — the
# platform builder's own namespace on qits-net, see half two — but the split stands.)
#
# THIS FILE IS INERT UNTIL AUTO RELEASE PUBLISHES SCMRelease, and it lands first on purpose: the
# bus is at-most-once with no catch-up and no replay, so a trigger file must be in place before the
# event it selects exists. The other order loses a release and looks like a train that quietly did
# not roll.
event: SCMRelease
when:
  - repository: { exact: qits-projects-service }
# THE RUN IS ANCHORED AT THE TAG IT BUILDS. `SCMRelease` carries `commitSha` — the commit the tag
# points at — since qits-projects 2026.905.73500, and qits-ci resolves these two dot-paths since
# 2026.905.83431. Before that the event named no commit at all: `branch` is the release request's
# BACKING BRANCH, which the tagging operation deletes, and `version` names a tag rather than a
# commit — so this file could declare no `checkout:`, the run was recorded at `main`, and every
# release displayed as `main@<head>`, a run recorded against a commit it did not build.
#
# `branch: version` IS NOT A MISNOMER. The key is named for the run row's ref column, and a tag is a
# ref: the daemon clones `--branch "$QITS_CI_BRANCH"`, which git resolves against tags exactly as
# against heads, and the sha is what `checkout --detach` then lands on. Nothing in qits-ci holds a
# concept of a tag.
#
# `optional: true` IS THE TRANSITION AND IT STAYS UNTIL NO OLD EVENT CAN ARRIVE. `commitSha` is
# additive, so an `SCMRelease` published before it existed — a replay out of the durable log, a
# hand-built event through qits-ci's manual trigger door — resolves nothing here. Without the flag
# that would cost this pipeline its run, which is a released version whose artifact is silently
# never published. With it, such a run is recorded at `main`'s head, byte-for-byte as before, and
# the `git fetch refs/tags/$version` in the step below is what supplies the released tree — which
# is why that fetch STAYS: a no-op on the anchored path, the whole mechanism on the fallback one.
checkout:
  branch: version       # the tag's name — a ref name, which `clone --branch` resolves
  sha: commitSha        # what it points at; absent on any release published before the field
  optional: true        # ...and then this run is main's head, exactly as it was before
artifacts:
  - { type: docker, name: qits/qits-projects }
steps:
    # node-docker-base, the image the QA pipeline uses too: node, npm and git for half one,
    # buildctl for half two — and node is also what reads the event payload, which is JSON.
    #
    # `build: true` REPLACED `docker: true` WHEN THE BUILD MOVED OFF THE HOST DAEMON. It is the
    # per-step, diff-visible declaration the platform keys everything on — the commissioned
    # credential, the auth document, and the platform builder's address, which qits-containers
    # injects as $BUILDKIT_HOST into exactly these steps — and unlike its predecessor it mounts no
    # docker socket, because nothing here uses one. qits-buildkit-plan.md is the whole migration.
  - image: qits/build-images/node-docker-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed buildctl call is
      # swallowed and the run reports SUCCESS — and a green release run is what makes qits-ci
      # announce the artifact. -u makes an unset injected variable stop the step too.
      set -eu

      # The builder, demanded loudly before anything is built. Unset means a qits-ci/qits-containers
      # pair too old to inject the pair; EMPTY means the kill switch (qits.ci.buildkit.enabled=false
      # spells off as empty-never-absent). Either way this recipe must fail here, naming the cause,
      # rather than compose a reference out of empty strings — a silent fallback is exactly what the
      # migration exists to remove.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"

      # THE EVENT, READ AS DATA. The payload reaches the container verbatim as one string in
      # $QITS_EVENT_PAYLOAD; there is no per-field projection.
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      # The version reaches a `sed` s### expression below, and `#` is that expression's own
      # delimiter — a version carrying one closes it, and GNU sed's `e` command then runs a shell.
      # Refused rather than quoted: a version here is a calver or a semver, and nothing legitimate
      # needs a character outside this set. The existence check further down happens to reject a `#`
      # too (curl truncates a url at a fragment), but that is an accident of curl, not a guard.
      case "$version" in
        ''|*[!0-9A-Za-z._+-]*) echo "refusing an implausible version: $version" >&2; exit 1 ;;
      esac
      echo "releasing qits/qits-projects:$version"

      # THE TAG IS THE CHECKOUT TARGET, and it is the only reason this run needs one. An
      # event-triggered run is cloned at the head of main, which is where the release commit is
      # *now* — a later push moves that, and the tag does not, so a busy main cannot make this
      # pipeline ship a different tree than the one that was released. The clone is shallow and
      # carries no tags, hence the explicit refspec; the URL rather than `origin` because every
      # address a step needs arrives as environment. `checkout --detach` peels the annotated tag to
      # its commit — and it is what makes the submodule fetch below land on the gitlink the release
      # recorded rather than on main's.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # --- half one: the bundle -----------------------------------------------------------------
      # The daemon's clone is shallow and does not recurse, so the qits-projects-frontend submodule
      # arrives as an empty directory and Quinoa fails the image build on it. See
      # ci-event-release-request.yml for why the lockfile origins are rewritten and why the registry is
      # passed as environment rather than as a file — that repo's committed .npmrc outranks any
      # ~/.npmrc this step could write.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-projects-frontend"
      git -c submodule.qits-projects-frontend.url="$frontend_url" submodule update --init service/src/main/webui

      cd service/src/main/webui
      # TWO SERVICES since the byte-plane split, so the swap reads the PATH: an entry under the
      # hosted registry's own pathname ($QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/) gets the
      # hosted origin and everything else gets the proxy's, and the broad expression has to run
      # before the narrow one. ci-event-release-request.yml carries the full reasoning.
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      npm run build
      cd -

      # --- half two: the image ------------------------------------------------------------------
      # NO --network host, AND NOTHING REPLACES IT: every `RUN` executes in the platform builder's
      # own namespace on qits-net, so the builder stage's resolve of qits-eventstream and its two
      # companions goes to $QITS_MAVEN_REGISTRY_URL and Maven Central to $QITS_MAVEN_PROXY_URL — both
      # IN-NETWORK addresses, where these lines used to spell the host-published
      # `http://$QITS_REGISTRY/…` and the edge vhost $QITS_MAVEN_CENTRAL_MIRROR_URL. Both are still
      # derived from injected env rather than written down: the artifacts store is an environment
      # service. ci-event-release-request.yml carries the full reasoning.
      #
      # THE CREDENTIAL IS A SECRET AND NEVER A BUILD ARG — an arg is recorded in the image history,
      # and this image is pullable. In FILE form on both sides: written under umask 077 into /tmp,
      # outside the clone so it cannot enter the build context, and mounted by the Dockerfile as a
      # bare file under /run/secrets, never the `env=` mount form that couples this recipe to the
      # builder's frontend version. The launcher injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; `:-` keeps the pair optional
      # exactly as `--secret …,env=` did, so a deployment with no idp client still builds green.
      # ci-event-release-request.yml writes the same two files, and the two must stay matched.
      umask 077
      printf '%s' "${QITS_COMMISSIONED_CLIENT_ID:-}" > /tmp/qits-client-id
      printf '%s' "${QITS_COMMISSIONED_CLIENT_SECRET:-}" > /tmp/qits-client-secret

      # `push=true` IS THE PUBLISH: the image goes from the builder straight to the registry and
      # never enters any local image store — which is why there is no `docker push` line and no
      # `docker rmi` question left; the old note here about a concurrent-build rmi race described a
      # store this pipeline no longer touches. $QITS_BUILD_REGISTRY is the registry as the BUILDER
      # resolves it; $QITS_REGISTRY stays the host daemon's view and is not dialled here.
      ref="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-projects:$version"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$ref,push=true"

      # --- the SBOM -----------------------------------------------------------------------------
      # THE DOCUMENT GOES UP AFTER THE PUSH AND BEFORE THIS STEP EXITS GREEN. qits-ci announces
      # `SoftwareRelease` only for a green run, so ordering is the whole guarantee: no consumer is
      # ever told about a version whose bill of materials is missing. A failed PUT fails the release
      # ON PURPOSE — the store being down is not a reason to announce a version nobody can audit.
      # Only THIS pipeline uploads one: the QA pipeline publishes no image and announces no
      # release, so it owes no document. The document is the service module's, the one module this image ships;
      # the domain, gitmirror, epics and protocol jars beside it in the reactor are undeclared
      # above and nothing here speaks for them.
      #
      # The second `buildctl build` reaches the Dockerfile's `sbom` stage — a `FROM scratch` holding
      # only that module's CycloneDX document, exported with `type=local` instead of pushed. Args and
      # secrets are BYTE-IDENTICAL to the image build above, which is what makes every layer a cache
      # hit in the same builder and this export seconds rather than a second native compile; a drift
      # between the two invocations costs a full rebuild, not a wrong document.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output type=local,dest=.sbom
      # The SBOM store is a sibling path of the npm registry inside the qits-artifacts deployment,
      # so its root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias a STEP container can
      # reach. NOT from $QITS_REGISTRY: that is the host daemon's view of the registry, which this
      # step does not dial at all any more, and inside this container it answers curl with an instant
      # connection refusal (measured twice, back when the pushes above went through the daemon while
      # the same host name was unreachable from in here; the edge 401s a sessionless write besides).
      # Not from $QITS_BUILD_REGISTRY either: that one is the BUILDER's view. The path names the
      # DECLARED artifact identity verbatim: `artifacts:` above says `{type: docker, name:
      # qits/qits-projects}`, and (packageType, packageName, version) is how the SoftwareRelease
      # consumer will ask for it.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @.sbom/sbom.json \
        "$sbom_base/docker/qits/qits-projects/-/$version"

# Projects config defaults, shipped from this library jar.
#
# Library jars ship defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's
# application.properties is ignored — read by whichever app pulls the jar in. The consuming app's
# own application.properties (ordinal 250) and the environment override any of these.

# --- persistence ------------------------------------------------------------------------------
# This context owns its OWN named datasource + persistence unit + Flyway lineage: its own postgres
# database, never sharing qits' default DB or its migration history (the artifacts/ci/epics
# precedent). All three tables it touches — Project, Repository, repository_name — live in THIS
# database, which is why they keep real foreign keys between them. Rows in other contexts
# (workspaces, commands, agents) are referenced by String id through a control/ port instead. The
# suites point the same three keys at an embedded postgres (see testdb/EmbeddedPgConfigSource).
#
# THE GENERIC RESOURCE CONTRACT, NOT A DEPLOYMENT-SPECIFIC KEY. This repository's
# .config/qits/deployments.yml declares `resources: postgresql:db, postgresql:epics:qits_epics`;
# qits-platform-deployments creates the role and the database before the cutover and injects
# QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD into the container it starts. `db` is this
# datasource's name in that line, and its database defaults to qits_projects — the application name
# without the qits- prefix. Nothing about the mapping below is the deployer's business: an
# application maps the generic variables in its own shipped defaults, which is what keeps the
# deployer framework-agnostic. Epics maps QITS_RESOURCE_EPICS_* the same way in the sibling jar.
#
# THE TRIPLE HAS NO DEFAULTS AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming the missing
# variable rather than opening some fallback store nobody meant. There is no local file to fall
# back to any more, and the old one was never usable in the image anyway: `user.home` resolves to
# the literal `?` under this container's uid, so the shipped H2 default failed at the first connect
# (docker/Dockerfile says so at length). A deployment that has not been given a database has
# nothing to be usefully started as.
quarkus.datasource.projects.db-kind=postgresql
quarkus.datasource.projects.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.projects.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.projects.password=${QITS_RESOURCE_DB_PASSWORD}

# A dedicated persistence unit bound to that datasource, owning only this module's entities.
quarkus.hibernate-orm.projects.datasource=projects
quarkus.hibernate-orm.projects.packages=eu.wohlben.qits.projects.entity

# Own Flyway lineage at a distinct classpath location so it never mixes with the monorepo's
# db/migration. V1__init.sql restarted with the move to postgres: it is the H2 lineage's V1..V6
# arrived at, translated, not a replay of it.
#
# baseline-on-migrate is GONE with that lineage. It told Flyway to adopt a non-empty schema it had
# no history table for, which the H2 file needed while it was being adopted; every database this
# code now meets is either empty or was created by this very lineage, and the flag would only mask
# the one case worth failing on — a schema somebody else put there.
quarkus.flyway.projects.migrate-at-start=true
quarkus.flyway.projects.locations=classpath:db/projects/migration

# Where `git credential-store` keeps the credentials a remote-login session captures. Stays on
# projects' OWN volume even after the decoupling — see GitRemoteAuth's javadoc.
qits.repositories.credentials-file=${user.home}/.qits/data/git-credentials

# --- this service's own git substrate (projects-volume-decoupling-plan.md §3.2) ------------------
# Where the git mirrors live (one per repository) and where a project template's scratch tree is
# built. Private to this service, beside its database, on the volume it already owns — nothing else
# reads this tree, which is the whole point of projects-volume-decoupling-plan.md.
qits.projects.data-dir=${user.home}/.qits/data/projects

# Scheme, host and port with NO path — the same shape qits.observability.url uses, so one value
# works whether the call goes direct on qits-net or through the gateway. The /git/<repoId>
# segment is qits-githost's own contract and is spelled in ConfiguredGitHostAddress, not
# here: it belongs to the git host rather than to a deployment.
#
# The key is qits.githost.url and was qits.artifacts.url until the byte-plane split moved the git
# smart-HTTP server out of qits-artifacts into a service of its own. Renamed rather than repointed
# on purpose: a deployment still passing QITS_ARTIFACTS_URL now configures nothing and takes this
# default, instead of aiming every mirror clone, fetch, push and lifecycle call at a service that no
# longer serves git.
#
# The default carries an ENVIRONMENT, because qits-githost is an environment service: it is deployed
# once per environment as <env>-qits-githost and only a deployment knows which one. So this is the
# dev spelling — right for a developer's process against the standing environment, and a placeholder
# everywhere else. A deployment's run-args own the real value.
qits.githost.url=http://dev-qits-githost:8080

# Every git call that talks to the git host — the mirror's clone and fetch, ls-remote, and every
# push — carries this deadline. One key rather than one per verb: they are the same failure, a
# wedged host pinning a request thread. Local git inside the mirror keeps its unbounded wait, where
# a bound would only turn slow into broken.
qits.projects.git.network-timeout-ms=120000

# How long a fetched mirror is trusted before a read refreshes it again — bounds UI reads only.
# Nothing that DECIDES anything reads through it: branch existence is an ls-remote against the git
# host, and every flow about to write forces a refresh first.
qits.projects.git.mirror-freshness-ms=5000

# The git host's push-token, under the SAME key qits-githost's ProtectedRefHook reads it from
# (qits.repositories.git.push-token there too) — one deployment value, presented back on every push
# this service makes to the host except a branch delete (RepositoryService#withHostToken). No
# default here on purpose: unset means this service presents no token, matching the hook's own
# "unset matches nothing" rule, so a deployment that has not turned protection on needs nothing set.

# The identity qits commits as when it writes on a repository's behalf.
qits.git.author-name=qits
qits.git.author-email=qits@local

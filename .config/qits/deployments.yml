# How qits-platform-deployments deploys this repo. It reads this file from the git host at
# the built sha, so the answer travels with the commit.
#
# `routes` is the path prefix the edge sends here — on EVERY vhost, so /projects/api reaches this
# service from any application's host. `host` is the DNS label of this service's OWN vhost,
# projects.<env>.<domain>, where the SPA is served at `/`. It is spelled rather than derived only
# because the derivation (application name minus qits-/qits-platform-) already answers `projects`
# and this is the landing service — the edge sends `/` on the environment host here, so the label
# is worth stating out loud.
#
# `navigation-entries` places this application in the shared sidebar: `<slot>.<Label>:<position>`,
# comma separated. `system.Overview:1` puts it first in the global group, which is what replaced
# the synthesized Home link. It supersedes the old flat `navigation: Projects:4` — that key still
# parses, and naming both is an error.
#
# CARRYING THE FILE AT ALL is the other thing it says. qits-workspaces reads it on a release to
# decide whether this repository deploys — a library or an SPA carries none and its release is
# the trunk push alone — and then promotes onto the branch it is configured with
# (`qits.workspaces.release.entry-branch`). `deploy_branches` used to name that branch here, in
# thirteen copies of one platform-wide answer, and a release pushed onto every entry it named.
#
# ENVIRONMENT service: every environment runs its own instance, and a green build deploys into
# whichever tier listens to the built branch.
deployment_target: environment

# WHAT THIS REPOSITORY DEPLOYS AS, held still across the repository rename. The repository is
# qits-projects-service now; the application is still qits-projects, so nothing that is running
# moves: the swarm service and its wire alias, the container, the image qits/qits-projects the build
# pushes, the provisioned database, the derived host label, the extras family and the
# QITS_APPLICATION the container boots with all keep the names they have. Omitted, this name would
# be DERIVED from the repository, and the rename would read as a decommission plus a new application
# rather than a rename. Changing the value later is exactly that decommission, so it does not change
# again.
application: qits-projects

routes: /projects
host: projects
# TWO placements, and the second is on all six archetype slots.
#
# `system.Overview:1` is the environment's own door, first in the global group.
#
# `<category>.details.Release Requests:3=release-requests` is the per-repository row, and it opens
# this SPA's `/<project>/<group>/<repo>/release-requests` — the repository's release requests, which
# is the asynchronous gated ask that replaced calling the release door blind. It is declared on
# every one of the six archetype slots because every kind of repository is released: a library, an
# SPA and an OCI image each go through the same request, so a row that hung under services alone
# would be missing exactly where a person most often has to ask why nothing landed.
#
# POSITION 3 IS A RENUMBER, not a free slot. The detail group ran Docs 2, Code 3, CI 4, Artifacts 5,
# Configuration 6, Workspaces 7; this row goes above Code, so qits-githost, qits-ci, qits-artifacts,
# qits-configuration and qits-workspaces each moved up one in the same change. The alternative was to
# share position 2 with Docs and let the tie-break do the ordering — the edge sorts by position, then
# label, then application, and "Docs" < "Release Requests" — but that makes the order an accident of
# the *label*, so renaming this row to "Releases" would silently move it above Docs. Integers that
# say what they mean are worth five one-line commits.
#
# The `services.details.Api Docs` entry this file used to carry is still gone and is not coming
# back: API documentation is a sub-item of Docs now (the docs app renders it from published @apidocs
# bundles). This application's viewer route (`/<project>/services/<repo>/api-docs`, the live
# swagger-ui frame) still answers; it is just not a sidebar row.
navigation-entries: system.Overview:1, services.details.Release Requests:3=release-requests, daemons.details.Release Requests:3=release-requests, libs.details.Release Requests:3=release-requests, frontends.details.Release Requests:3=release-requests, cli.details.Release Requests:3=release-requests, images.details.Release Requests:3=release-requests

# THREE DATABASES, because this application opens three datasources with three Flyway lineages:
# `projects` (domain/), `epics` (epics/) and `eventstream` (the qits-eventstream jar's outbox and
# durable-claim tables). qits-platform-deployments creates a login role and a database for each on
# the postgres of this tier before the container starts, and injects
# QITS_RESOURCE_<NAME>_URL / _USERNAME / _PASSWORD — the generic contract the three library jars map
# onto quarkus.datasource.* in their own shipped defaults.
#
# `db` takes the DERIVED default database, qits_projects: `qits_` plus the application name without
# its qits- prefix, dashes to underscores. `epics` and `eventstream` NAME their databases, and have
# to: the default is derived from the application, so all three entries would have asked for
# qits_projects.
#
# THE EVENTSTREAM ENTRY IS NOT OPTIONAL AND ITS NAME IS LOAD-BEARING. This service consumes the git
# host's SCM events durably (bus/ScmBackupTriggerListener), which is what replaced the post-receive
# HTTP call its backup trigger used to arrive on. The jar reads QITS_RESOURCE_EVENTSTREAM_*, so the
# resource name here is what makes those variables exist; rename it and the expression is
# unresolvable and the process refuses to boot at Flyway. Being dark (`qits.eventstream.enabled`)
# would not save it — dark stops publishing, sweeping and dialling, never the datasource.
resources: postgresql:db, postgresql:epics:qits_epics, postgresql:eventstream:qits_projects_eventstream

# Where the browsable API document lives: swagger-ui under this service's non-application
# root, which sits under the primary route above. The shell's Api Docs viewer reads it off
# /main-navigation and frames it for this repository.
api-docs: /projects/q/swagger-ui

# A FREE port, not Quarkus' default test port 8081 — the same line, for the same reason, that
# `service`'s properties carry. This module has no web layer of its own and never needed it; the
# qits-eventstream jar brought vertx-http in with the causation trio, so this suite opens an HTTP
# server now whether it wants one or not. On the machine this repo is most likely to be built on,
# 8081 is the platform's own npm registry (qits-platform-artifacts), so the default died with "Port
# already bound: 8081: Address already in use" — which reads like a code failure and is not one.
quarkus.http.test-port=0

# NO DEV SERVICES. This repo's first rule is that a clone builds and tests green with no docker, and
# a dev service is a container start. Nothing here needs one — the datasource below already has a
# url — and this line is what keeps it that way if one ever loses it.
quarkus.devservices.enabled=false

# The suite runs against an EMBEDDED POSTGRES — real binaries, spawned as a child process by zonky,
# never a container. Its port is chosen at run time, so the url/username/password are NOT written
# here at all: testdb/DomainEmbeddedPgConfigSource supplies them at an ordinal above this file,
# overriding the ${QITS_RESOURCE_DB_*} expressions the jar ships. What is left here is what a file
# can say. clean-at-start wipes the schema between Quarkus restarts, which is what keeps a suite
# sharing one database across classes reproducible.
quarkus.datasource.projects.db-kind=postgresql
quarkus.hibernate-orm.projects.datasource=projects
quarkus.hibernate-orm.projects.packages=eu.wohlben.qits.projects.entity
quarkus.flyway.projects.migrate-at-start=true
quarkus.flyway.projects.clean-at-start=true
quarkus.flyway.projects.locations=classpath:db/projects/migration

# One stable mirror root shared by the whole suite, so repository tests share a single Quarkus app
# instead of each spinning up its own (a per-class @TestProfile with a unique temp dir used to force
# a full app restart per class). Per-class isolation is restored by RepoDataDirReset, which wipes
# this dir before every test class — along with the fake git host's bares
# (FakeGitHostAddress/FakeGitHostRepositories), whose root is a fixed literal rather than a key.
qits.projects.data-dir=target/qits-test-projects

# Keep the git credential store under target/, never the real ~/.qits the jar default points at.
qits.repositories.credentials-file=target/test-data/git-credentials

# The eventstream jar rides in with CausedRow (Project's and Repository's causation column), and
# this suite owes it the same two facts `service`'s owes: darkness — no publish, no sweep, no dial
# — and a database, which DomainEmbeddedPgConfigSource supplies beside the projects one.
# clean-at-start for the same reproducibility the projects datasource gets; no catch-up at startup,
# so nothing consumes behind a test's back. This module has no listener and publishes nothing; the
# jar is here for three persistence types.
qits.eventstream.enabled=false
qits.eventstream.catchup-at-startup=false
quarkus.flyway.eventstream.clean-at-start=true

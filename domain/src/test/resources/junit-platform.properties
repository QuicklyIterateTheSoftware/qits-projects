# Quarkus REQUIRES this class orderer so test classes sharing a @TestProfile run consecutively and
# reuse one booted app (skipping a restart per class). JUnit reads only the first
# junit-platform.properties on the classpath, so once we ship this file we must set the orderer here
# ourselves or Quarkus can't — omitting it makes every @QuarkusTest fork abort with "corrupted
# application" at startup.
junit.jupiter.testclass.order.default=io.quarkus.test.junit.util.QuarkusTestProfileAwareClassOrderer

# Auto-register src/test/resources/META-INF/services extensions (RepoDataDirReset) for every test
# class, so repository tests share one Quarkus app (stable qits.projects.data-dir) instead of
# each forcing an app restart via a per-class @TestProfile temp dir. See RepoDataDirReset.
junit.jupiter.extensions.autodetection.enabled=true

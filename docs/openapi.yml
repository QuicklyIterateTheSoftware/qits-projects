      summary: Active Process
      tags:
      - Repository Controller
  /projects/api/repositories/{repoId}/backup-sync:
    post:
      summary: Back this repository up to its forge twin now
      description: "Schedules the same backup the git host's post-receive triggers,\
        \ debounced per repository. The outcome lands on the repository's lastBackup\
        \ rather than in this response."
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      responses:
        "202":
          description: Queued
          content:
            application/json:

# The epics suite runs against in-memory H2 (no docker), overriding the file-H2 default shipped in
# this jar's META-INF/microprofile-config.properties. clean-at-start wipes between runs.
quarkus.datasource.epics.db-kind=h2
quarkus.datasource.epics.jdbc.url=jdbc:h2:mem:epics;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.epics.datasource=epics
quarkus.hibernate-orm.epics.packages=eu.wohlben.qits.epics.entity
quarkus.flyway.epics.migrate-at-start=true
quarkus.flyway.epics.clean-at-start=true
quarkus.flyway.epics.locations=classpath:db/epics/migration

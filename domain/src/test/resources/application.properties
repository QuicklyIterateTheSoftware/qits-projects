# The suite runs against in-memory H2 (no docker), overriding the file-H2 default shipped in
# src/main/resources/META-INF/microprofile-config.properties. clean-at-start wipes between runs.
quarkus.datasource.projects.db-kind=h2
quarkus.datasource.projects.jdbc.url=jdbc:h2:mem:projects;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.projects.datasource=projects
quarkus.hibernate-orm.projects.packages=eu.wohlben.qits.projects.entity
quarkus.flyway.projects.migrate-at-start=true
quarkus.flyway.projects.clean-at-start=true
quarkus.flyway.projects.locations=classpath:db/projects/migration

# One stable repositories dir shared by the whole suite, so repository tests share a single Quarkus
# app instead of each spinning up its own (a per-class @TestProfile with a unique temp dir used to
# force a full app restart per class). Per-class isolation is restored by RepoDataDirReset, which
# wipes this dir before every test class.
qits.repositories.data-dir=target/qits-test-repos

# Keep the git credential store under target/, never the real ~/.qits the jar default points at.
qits.repositories.credentials-file=target/test-data/git-credentials

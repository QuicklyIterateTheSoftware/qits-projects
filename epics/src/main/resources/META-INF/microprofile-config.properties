# Epics config defaults, shipped from this library jar (docs/epics/qits-epics/). Library jars ship
# defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties
# is ignored — read by whichever app pulls the jar in (the `artifacts` + `auth/*` modules ship their
# config the same way). The consuming app / env overrides any of these.
#
# Epics owns its OWN named datasource + persistence unit + Flyway lineage: its own postgres
# database, never sharing qits' default DB or its migration history, so the future split into a
# standalone service moves a database rather than tables out of somebody else's (the artifacts
# precedent). Because it is a separate physical DB, epic.project_id / task.repository_id are plain
# String columns with NO cross-boundary FK — existence is validated in `service`'s controllers
# (which see `domain`). The suites point the same three keys at an embedded postgres (see
# testdb/EmbeddedPgConfigSource in this and the service module).
#
# THE SECOND RESOURCE THIS APPLICATION DECLARES. .config/qits/deployments.yml carries
# `resources: postgresql:db, postgresql:epics:qits_epics`: `db` is domain's datasource and defaults
# to qits_projects, `epics` is this one and NAMES its database outright, because the default would
# have been qits_projects too and one application cannot have two databases with one name. The
# deployer creates the role and the database before the cutover and injects QITS_RESOURCE_EPICS_URL
# / _USERNAME / _PASSWORD; mapping those three onto framework keys is this jar's job, not the
# deployer's.
#
# NO DEFAULTS, the same refuse-to-boot stance domain's jar takes: an unset variable leaves these
# expressions unresolvable and the process dies at Flyway naming the missing one, rather than
# opening a store nobody meant. The H2 default this replaces could not open in the image anyway —
# `user.home` is the literal `?` under the container's uid.
quarkus.datasource.epics.db-kind=postgresql
quarkus.datasource.epics.jdbc.url=${QITS_RESOURCE_EPICS_URL}
quarkus.datasource.epics.username=${QITS_RESOURCE_EPICS_USERNAME}
quarkus.datasource.epics.password=${QITS_RESOURCE_EPICS_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER, WHICH STOCK AGROAL DOES NOT. Replacing the tier's postgres
# severs every pooled connection; without validation the pool hands a dead one to the next caller
# long after the database is back, and 5s of acquisition is not enough for the successor to take the
# alias. Validate at borrow, and wait 15s before giving up.
quarkus.datasource.epics.jdbc.acquisition-timeout=15S
quarkus.datasource.epics.jdbc.validate-on-borrow=true

# A dedicated persistence unit bound to the epics datasource, owning only this module's entities
# (the default PU keeps qits' domain entities). packages assigns entity→PU unambiguously.
quarkus.hibernate-orm.epics.datasource=epics
quarkus.hibernate-orm.epics.packages=eu.wohlben.qits.epics.entity

# Own Flyway lineage at a distinct classpath location so it never mixes with domain's db/migration.
# V1__init.sql restarted with the move to postgres: it is where the H2 lineage's V1..V3 arrived,
# translated, not a replay of it. baseline-on-migrate went with that lineage — it existed to let
# Flyway adopt an H2 file it had no history table for, and every database this code meets now is
# either empty or was created by this very lineage.
quarkus.flyway.epics.migrate-at-start=true
quarkus.flyway.epics.locations=classpath:db/epics/migration

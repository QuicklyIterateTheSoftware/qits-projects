# A FREE port, not Quarkus' default test port 8081 — the same line, for the same reason, that
# `service`'s properties carry. This module has no web layer of its own and never needed it; the
# qits-eventstream jar brought vertx-http in with the causation trio, so this suite opens an HTTP
# server now whether it wants one or not. On the machine this repo is most likely to be built on,
# 8081 is the platform's own npm registry (qits-platform-artifacts), so the default dies with "Port
# already bound: 8081: Address already in use" — which reads like a code failure and is not one.
quarkus.http.test-port=0

# NO DEV SERVICES. This repo's first rule is that a clone builds and tests green with no docker, and
# a dev service is a container start. Nothing here needs one, and this line is what keeps it so.
quarkus.devservices.enabled=false

# The epics suite runs against an EMBEDDED POSTGRES — real binaries, spawned as a child process by
# zonky, never a container. Its port is chosen at run time, so the url/username/password are NOT
# written here: testdb/EpicsEmbeddedPgConfigSource supplies them at an ordinal above this file,
# overriding the ${QITS_RESOURCE_EPICS_*} expressions this jar ships. clean-at-start wipes between
# runs.
quarkus.datasource.epics.db-kind=postgresql
quarkus.hibernate-orm.epics.datasource=epics
quarkus.hibernate-orm.epics.packages=eu.wohlben.qits.epics.entity
quarkus.flyway.epics.migrate-at-start=true
quarkus.flyway.epics.clean-at-start=true
quarkus.flyway.epics.locations=classpath:db/epics/migration

# The eventstream jar rides in with CausedRow (the causation column on all four entities), and this
# suite owes it the same two facts `service`'s owes: darkness — no publish, no sweep, no dial — and
# a database, which EpicsEmbeddedPgConfigSource supplies beside the epics one. clean-at-start for
# the same reproducibility the epics datasource gets; no catch-up at startup, so nothing consumes
# behind a test's back. This module has no listener and publishes nothing; the jar is here for
# three persistence types.
qits.eventstream.enabled=false
qits.eventstream.catchup-at-startup=false
quarkus.flyway.eventstream.clean-at-start=true

# Epics config defaults, shipped from this library jar (docs/epics/qits-epics/). Library jars ship
# defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties
# is ignored — read by whichever app pulls the jar in (the `artifacts` + `auth/*` modules ship their
# config the same way). The consuming app / env overrides any of these.
#
# Epics owns its OWN named datasource + persistence unit + Flyway lineage: a separate file-based H2
# under ~/.qits/data/epics, never sharing qits' default DB or its migration history, so the future
# split into a standalone service moves files, not data (the artifacts precedent). Because it is a
# separate physical DB, epic.project_id / task.repository_id are plain String columns with NO
# cross-boundary FK — existence is validated in `service`'s controllers (which see `domain`). Tests
# override the url to in-memory H2 (see src/test/resources/application.properties in this and the
# service module).
quarkus.datasource.epics.db-kind=h2
quarkus.datasource.epics.jdbc.url=jdbc:h2:file:${user.home}/.qits/data/epics/h2/epics;AUTO_SERVER=TRUE

# A dedicated persistence unit bound to the epics datasource, owning only this module's entities
# (the default PU keeps qits' domain entities). packages assigns entity→PU unambiguously.
quarkus.hibernate-orm.epics.datasource=epics
quarkus.hibernate-orm.epics.packages=eu.wohlben.qits.epics.entity

# Own Flyway lineage at a distinct classpath location so it never mixes with domain's db/migration.
quarkus.flyway.epics.migrate-at-start=true
quarkus.flyway.epics.baseline-on-migrate=true
quarkus.flyway.epics.locations=classpath:db/epics/migration

# EVERY ENTITY IN THIS MODULE PARTICIPATES, AND ARCHUNIT CALLS THAT AN EMPTY RULE.
#
# CausationRowRules' third rule is a negative one -- "nothing annotated @Uncaused may implement
# CausedRow" -- and ArchUnit fails a `should` that matched no classes at all, on the theory that an
# empty rule is usually a typo'd package. Here it is not: Epic, Feature, Task and AuditEntry are all
# CausedRow, so no class carries @Uncaused and the contradiction the rule looks for cannot exist.
# The build went red for the module being in the BEST state the rules describe.
#
# `domain` needs no copy of this file: RepositoryName is @Uncaused there, so the same rule has a
# class to check and the meta-check stays live where it can fire.
#
# What this gives up is nil in practice. All three rules select on @Entity, so the only way any of
# them goes empty is a module with no entities -- and such a module has no reason to declare an
# ArchRulesTest in the first place. The rules that do the work still run over all four classes here.
#
# The real home for this is qits-arch-rules, whose negative rule should carry allowEmptyShould(true)
# itself rather than making every all-participating consumer discover this. That repository is not
# this one's to change.
archRule.failOnEmptyShould=false

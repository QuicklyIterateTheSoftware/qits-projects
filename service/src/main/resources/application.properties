# The application config for qits-projects as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# `domain` and `epics` ship DEFAULTS they do not own the deployment of. Their datasources, Flyway
# lineages and repositories data-dir stay there; a deployment still overrides any of them by env.
#
# Everything here was previously supplied by the monorepo's app shell
# (service/src/main/resources/application.properties, monolith-only), which is why the suite carried
# private copies in src/test/resources and the packaged app had none.

quarkus.application.name=qits-projects

# The JAX-RS prefix every qits route lives under. Without it every route this service serves —
# /api/projects, /api/repositories, /api/epics, /api/features, /api/tasks — moves up one level and
# every caller 404s. The suite sets its own copy, so a test run stays green either way, which is
# exactly why this needs to be here and not only there.
quarkus.rest.path=/api

# The named MCP server the repository tools are registered under (@McpServer("repository")). Not
# optional: quarkus-mcp-server-http rejects an undeclared server name outright ("Invalid server
# name"), so omitting this does not disable the tools — it stops the process booting.
quarkus.mcp.server.repository.http.root-path=/mcp/repository

# --- the API document -------------------------------------------------------------------------
# Served at /q/openapi, with the browsable UI at /q/swagger-ui — both outside quarkus.rest.path.
# always-include because swagger-ui is a dev-mode-only extension by default, and the point of
# packaging these as processes is that each documents its own surface in a real deployment.
#
# This is the largest published surface of the six services and the one an Angular client is
# generated from, so the committed docs/openapi.yml matters more here than anywhere else.
quarkus.smallrye-openapi.info-title=qits-projects API
quarkus.swagger-ui.always-include=true

# Repository imports and archetype templates move real trees around; the monorepo raised this
# app-wide and these routes inherited it.
quarkus.http.limits.max-body-size=64M

# --- a shared on-disk contract, not just a path -------------------------------------------------
# qits.repositories.data-dir defaults in the domain jar to ~/.qits/data/repositories. It is NOT
# private to this service: qits-artifacts serves the same bare origins over git smart-HTTP and
# qits-workspaces branches from them. All three must resolve it to the same volume, or this service
# clones into a tree nothing else can see. Left at the jar default here so a deployment sets it once,
# for all three, rather than this repo pinning a value the others do not share.

      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRepositoryRequest"
        required: true
      responses:
        "200":
          description: The repository exists and the wrapper names it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response24"
        "400":
          description: "Neither or both of url/name, an unplaceable archetype, a name\
            \ already taken in the project, or a wrapper commit the git host refused"
      summary: Create Repository
      tags:
      - Project Controller
  /projects/api/projects/{projectId}/repositories/backup-sync:
    post:
      summary: Back up every repository of this project to its forge twin
      description: "Schedules a backup per repository that has a twin, debounced per\
        \ repository. Outcomes land on each repository's lastBackup rather than in\
        \ this response."
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        "202":
          description: Queued; the body says how many
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response26"
        "404":
          description: No such project
      tags:
      - Project Controller
  /projects/api/projects/{projectId}/repositories/reconcile:
    post:
      summary: Bring a project's repositories in line with its wrapper's .gitmodules
      description: "The wrapper repository is the project's configuration: every submodule\
        \ entry gets a repository (adopted when the git host already serves it, cloned\
        \ from the entry's backend otherwise), the directory an entry sits under decides\
        \ its archetype, and a repository no entry names is deregistered — its row\
        \ goes, its history on the git host stays. Idempotent, and the way a project\
        \ imported from a wrapper url is materialized."
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The reconcile ran. A per-entry failure is still a 200 — the
            outcomes are the result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response18"
        "400":
          description: The project has no wrapper repository
        "404":
          description: No such project
      tags:
      - Project Controller
  /projects/api/repositories/{repoId}:
    get:
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response31"
      summary: Get
      tags:
      - Repository Controller
    delete:
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response33"
      summary: Delete
      tags:
      - Repository Controller
  /projects/api/repositories/{repoId}/active-process:

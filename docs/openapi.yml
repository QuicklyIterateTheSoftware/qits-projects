  /projects/api/projects/{projectId}/reconcile:
    post:
      summary: Re-assert a project's domain against qits-dns
      description: "Project creation registers the dns record fire-and-forget, so\
        \ a receiver that was down when a project was created leaves the record missing\
        \ with nothing to carry it forward. This re-asserts it synchronously and reports\
        \ the outcome; the receiver is idempotent, so it is safe to repeat, and it\
        \ is also how a project created before the hook existed gets its record."
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The reconcile ran. A failed re-assertion is still a 200 — the
            outcome is the result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response19"
        "404":
          description: No such project
      tags:
      - Project Controller

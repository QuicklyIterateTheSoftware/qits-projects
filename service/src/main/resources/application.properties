# The application config for qits-projects as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# `domain` and `epics` ship DEFAULTS they do not own the deployment of. Their datasources, Flyway
# lineages and repositories data-dir stay there; a deployment still overrides any of them by env.
#
# Everything here was previously supplied by the monorepo's app shell
# (service/src/main/resources/application.properties, monolith-only), which is why the suite carried
# private copies in src/test/resources and the packaged app had none.

quarkus.application.name=qits-projects

# The JAX-RS prefix every qits route lives under: /<segment>/api, where the segment is this
# service's name without the qits- prefix. qits-gateway routes VERBATIM by prefix — /projects/* goes
# to qits-projects with no rewriting — so the leading segment is not decoration, it is the
# difference between this service being reachable through the gateway and not being reachable at
# all. Everything it serves hangs off it: /projects/api/projects, /projects/api/repositories,
# /projects/api/epics, /projects/api/features, /projects/api/tasks. Drop or shorten it and every
# caller 404s. Note the remote-login websocket does NOT follow this key — @WebSocket takes a literal
# path and spells the prefix out itself (RemoteLoginTerminalSocket).
quarkus.rest.path=/projects/api

# The named MCP server the repository tools are registered under (@McpServer("repository")), served
# under this service's segment. The server NAME stays `repository` while the path becomes
# /projects/mcp: these tools are genuinely repository-scoped and qits-workspace-daemon addresses the
# server by that name. (qits-observability renamed its own `repository` server to `observability` —
# it had no repository tools in it, and two servers sharing a name meant the daemon could only ever
# point at one of them.) Not optional: quarkus-mcp-server-http rejects an undeclared server name
# outright ("Invalid server name"), so omitting this does not disable the tools — it stops the
# process booting.
quarkus.mcp.server.repository.http.root-path=/projects/mcp

# Quarkus' non-application root path: what the framework serves rather than application code (the
# OpenAPI document, swagger-ui, health). It sits OUTSIDE quarkus.rest.path and moves only via this
# key, so without it /q/* stays at the root — where a prefix-routing gateway cannot reach it.
quarkus.http.non-application-root-path=/projects/q

# --- the API document -------------------------------------------------------------------------
# Served at /projects/q/openapi, with the browsable UI at /projects/q/swagger-ui — both under
# quarkus.http.non-application-root-path above, not quarkus.rest.path. quarkus.swagger-ui.path is
# relative by default and follows automatically; do not pin it.
# always-include because swagger-ui is a dev-mode-only extension by default, and the point of
# packaging these as processes is that each documents its own surface in a real deployment.
#
# This is the largest published surface of the six services and the one an Angular client is
# generated from, so the committed docs/openapi.yml matters more here than anywhere else.
quarkus.smallrye-openapi.info-title=qits-projects API
quarkus.swagger-ui.always-include=true

# Repository imports and archetype templates move real trees around; the monorepo raised this
# app-wide and these routes inherited it.
quarkus.http.limits.max-body-size=64M

# --- a shared on-disk contract, not just a path -------------------------------------------------
# qits.repositories.data-dir defaults in the domain jar to ~/.qits/data/repositories. It is NOT
# private to this service: qits-artifacts serves the same bare origins over git smart-HTTP and
# qits-workspaces branches from them. All three must resolve it to the same volume, or this service
# clones into a tree nothing else can see. Left at the jar default here so a deployment sets it once,
# for all three, rather than this repo pinning a value the others do not share.

  /projects/api/projects/{projectId}/repositories/backup-sync:
    post:
      summary: Back up every repository of this project to its forge twin
      description: "Schedules a backup per repository that has a twin, debounced per\
        \ repository. Outcomes land on each repository's lastBackup rather than in\
        \ this response."
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        "202":
          description: Queued; the body says how many
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response27"
        "404":

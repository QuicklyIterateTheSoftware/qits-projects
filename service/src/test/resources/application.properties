# Test-only overrides. Nothing else belongs here.
#
# Quarkus reads `src/main/resources/application.properties` during tests too and MERGES this file
# over it — the test copy does not shadow the main one, so deleting a key here leaves the shipped
# value in effect. App-level settings (quarkus.rest.path, the MCP root-path, the OpenAPI info, the
# body-size limit) therefore live in main's copy alone and must NOT be re-declared here: a test copy
# that drifts from the shipped copy makes the suite green about a configuration that never ships.
#
# What follows is only what genuinely differs under test.

# A FREE port, not Quarkus' default test port 8081. Two reasons, and the first is not theoretical:
# on the machine this service is most likely to be built on, 8081 is the address the platform's own
# npm registry (qits-platform-artifacts) is published on, so the whole suite dies with "Port already
# bound: 8081: Address already in use" — which reads like a code failure and is not one. Even where
# 8081 is free, @QuarkusTest restarts race each other for it, which is the flake AGENTS.md records.
# 0 lets the OS pick and RestAssured is told the real port.
quarkus.http.test-port=0

# NO DEV SERVICES. This repo's first rule is that a clone builds and tests green with no docker, and
# a dev service is a container start. Two named datasources that already have urls invite none, and
# this line is what keeps it that way if one ever loses its url.
quarkus.devservices.enabled=false

# The suite runs against an EMBEDDED POSTGRES — real binaries, spawned as a child process by zonky,
# never a container — with a database per datasource, the way a deployment gets one per `resources:`
# entry. Their ports are chosen at run time, so no url/username/password is written here at all:
# testdb/ServiceEmbeddedPgConfigSource supplies all six at an ordinal above this file, overriding
# the ${QITS_RESOURCE_*} expressions the domain and epics jars ship. clean-at-start wipes between
# runs.
quarkus.datasource.projects.db-kind=postgresql
quarkus.hibernate-orm.projects.datasource=projects
quarkus.hibernate-orm.projects.packages=eu.wohlben.qits.projects.entity
quarkus.flyway.projects.migrate-at-start=true
quarkus.flyway.projects.clean-at-start=true
quarkus.flyway.projects.locations=classpath:db/projects/migration

# Epics keeps its own lineage and its own datasource (migration-plan.md §7 "own lineage,
# unaffected") — its own database here for the same reason.
quarkus.datasource.epics.db-kind=postgresql
quarkus.flyway.epics.clean-at-start=true

# The qits-eventstream jar's outbox and claim tables. `qits.eventstream.enabled=false` (shipped in
# main's copy under %test) stops publishing, sweeping and dialling — never the datasource — so this
# datasource is opened and migrated in every @QuarkusTest here whether the bus is used or not.
quarkus.flyway.eventstream.clean-at-start=true

# The catch-up sweeper pages qits-events for every durable listener at startup and on an interval.
# There is no qits-events in this suite, so a tick would be a failed HTTP call per listener per
# interval — noise at best, and a delivery nothing asked for if a stub is ever added. Off at startup
# and effectively never on a timer; a test that wants a sweep calls CatchupSweeper.catchUp() itself.
# The SCHEDULER stays on: the outbox sweeper is scheduled too and has no business being disabled.
qits.eventstream.catchup-at-startup=false
qits.eventstream.catchup-interval=PT24H

# Same stable mirror root as the domain suite, for the same reason (see RepoDataDirReset).
# FakeGitHostAddress's fake host root is a fixed literal (target/qits-test-host), not a config key,
# so nothing to set for it here.
qits.repositories.credentials-file=target/test-data/git-credentials
qits.projects.data-dir=target/qits-test-projects

# --- the packaged-artifact IT ------------------------------------------------------------------
# PackagedSurfaceIT launches the built artifact as its own process (fast-jar normally, the native
# binary under -Dnative), which means it reads main's application.properties and the library jars'
# defaults and NONE of the overrides above — they are this JVM's config, not the launched one's.
# quarkus.test.arg-line is how config reaches that process, and without it the IT would clone into
# the developer's real ~/.qits. Everything here is a target/ path for the same reason the keys above
# are.
#
# THE TWO DATABASES ARE NOT HERE, and that is deliberate rather than an omission: their urls name a
# port the embedded postgres picks at run time, so they cannot be written into a file. The IT's own
# @TestProfile supplies both QITS_RESOURCE_* triples instead — the generic contract a deployment
# supplies, which leaves the jars' ${…} indirection itself under test.
quarkus.test.arg-line=-Dqits.projects.data-dir=./target/it-data/projects -Dqits.repositories.credentials-file=./target/it-data/git-credentials

# domain's test-jar carries the port implementations this suite injects (InMemoryProcessRegistry,
# RecordingWorkspaceLifecycle). Quarkus only scans a dependency for beans when it is indexed, and a
# test-jar is never indexed by default — hence the explicit entry, classifier included.
quarkus.index-dependency.projects-testsupport.group-id=eu.wohlben.qits
quarkus.index-dependency.projects-testsupport.artifact-id=qits-projects-domain
quarkus.index-dependency.projects-testsupport.classifier=tests

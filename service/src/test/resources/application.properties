# The suite runs against in-memory H2 (no docker), overriding the file-H2 defaults shipped in the
# domain and epics jars' META-INF/microprofile-config.properties. clean-at-start wipes between runs.
quarkus.datasource.projects.db-kind=h2
quarkus.datasource.projects.jdbc.url=jdbc:h2:mem:projects-svc;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.projects.datasource=projects
quarkus.hibernate-orm.projects.packages=eu.wohlben.qits.projects.entity
quarkus.flyway.projects.migrate-at-start=true
quarkus.flyway.projects.clean-at-start=true
quarkus.flyway.projects.locations=classpath:db/projects/migration

# Epics keeps its own lineage and its own datasource (migration-plan.md §7 "own lineage,
# unaffected") — in-memory here for the same reason.
quarkus.datasource.epics.db-kind=h2
quarkus.datasource.epics.jdbc.url=jdbc:h2:mem:epics-svc;DB_CLOSE_DELAY=-1
quarkus.flyway.epics.clean-at-start=true

# Same stable repositories dir as the domain suite, for the same reason (see RepoDataDirReset).
qits.repositories.data-dir=target/qits-test-repos
qits.repositories.credentials-file=target/test-data/git-credentials

# The JAX-RS prefix every qits route lives under. A consuming application sets this in its own
# application.properties (the monorepo app shell does); the tests assert against the same absolute
# paths, so they must set it too — without it every REST test 404s.
quarkus.rest.path=/api

# domain's test-jar carries the port implementations this suite injects (InMemoryProcessRegistry,
# RecordingWorkspaceLifecycle). Quarkus only scans a dependency for beans when it is indexed, and a
# test-jar is never indexed by default — hence the explicit entry, classifier included.
quarkus.index-dependency.projects-testsupport.group-id=eu.wohlben.qits
quarkus.index-dependency.projects-testsupport.artifact-id=qits-projects-domain
quarkus.index-dependency.projects-testsupport.classifier=tests

# The named MCP server the repository tools are registered under (@McpServer("repository")). The
# extension rejects an undeclared name outright ("Invalid server name"), so the root-path — which a
# consuming application sets in its own application.properties, as the monorepo app shell does — has
# to be re-provided here too, exactly like quarkus.rest.path above.
quarkus.mcp.server.repository.http.root-path=/mcp/repository
